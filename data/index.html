<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hệ Thống Điều Khiển Máy Bơm</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-container">
    <!-- Header: Ngày, Giờ & Trạng thái kết nối -->
    <header class="top-bar">
      <div class="datetime-group">
        <div class="datetime-item">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="17" rx="3"></rect>
            <path d="M16 2v4M8 2v4M3 10h18"></path>
            <circle cx="17.5" cy="17.5" r="4.5" fill="#f0fbf6"></circle>
            <path d="M17.5 15.5v2l1.2 1.2"></path>
          </svg>
          <span>Ngày <span id="current-date">20/11/2026</span></span>
        </div>
        <div class="datetime-item">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
          <span>Thời gian <span id="current-time">13 : 15 : 59</span></span>
        </div>
      </div>

      <div id="connection-badge" class="status-badge connected">
        <span class="status-dot"></span>
        <span id="connection-text">Đã kết nối</span>
      </div>
    </header>

    <!-- Mascot Cây Xanh (SVG Vector nhẹ, sắc nét) -->
    <section class="mascot-section" aria-label="Biểu tượng cây xanh">
      <svg class="tree-mascot" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
        <!-- Cỏ dưới gốc -->
        <ellipse cx="100" cy="164" rx="52" ry="6" fill="#65a30d" opacity="0.35"/>
        <path d="M56 163c-2-7-7-10-10-9 2 4 3 7 3 9h7zm86 0c2-8 8-11 11-9-2 4-3 7-3 9h-8z" fill="#65a30d" stroke="#2d3a1e" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- Thân và rễ cây -->
        <path d="M86 105c0 24-4 45-18 57h64c-14-12-18-33-18-57" fill="#854d27" stroke="#2d3a1e" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M92 108L72 92m36 16l20-16" stroke="#854d27" stroke-width="11" stroke-linecap="round"/>
        <path d="M92 108L72 92m36 16l20-16" stroke="#2d3a1e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M96 120c0 15-2 30-9 41m17-41c0 15 2 30 9 41" stroke="#5c3317" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Tán lá chính -->
        <path d="M56 104c-16 0-27-11-27-25 0-11 7-20 17-23-1-3-2-6-2-9 0-14 12-25 26-25 6 0 11 2 15 5 4-4 10-7 16-7 12 0 22 8 25 19 14 2 25 14 25 28 0 15-12 27-27 27-4 6-11 10-19 10-7 0-13-3-17-7-5 5-11 7-18 7-6 0-11-2-14-5z" fill="#84cc16" stroke="#2d3a1e" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- Điểm nhấn sáng trên tán lá -->
        <circle cx="43" cy="79" r="9" fill="#a3e635" stroke="#2d3a1e" stroke-width="3"/>
        <circle cx="143" cy="52" r="7" fill="#a3e635" stroke="#2d3a1e" stroke-width="3"/>
        <path d="M64 34c8-6 20-6 28 0" stroke="#bef264" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <!-- Khuôn mặt cười -->
        <path d="M74 68c3-6 11-6 14 0m24 0c3-6 11-6 14 0" stroke="#2d3a1e" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M91 66h18c0 11-4 17-9 17s-9-6-9-17z" fill="#2d3a1e" stroke="#2d3a1e" stroke-width="2" stroke-linejoin="round"/>
        <path d="M94 76c3-3 9-3 12 0-1 4-3 6-6 6s-5-2-6-6z" fill="#86efac"/>
      </svg>
    </section>

    <!-- Thẻ hiển thị cảm biến -->
    <section class="sensor-list">
      <div class="sensor-card">
        <svg class="sensor-icon" viewBox="0 0 36 36" fill="none">
          <path d="M14 21.5V8a4 4 0 1 1 8 0v13.5a7 7 0 1 1-8 0z" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="26" r="3.2" fill="#ea580c"/>
          <path d="M18 13v10M25 9h3M25 13h2M25 17h3" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="sensor-text temp-text">
          Nhiệt độ : <span id="temp-value">--</span> °C
        </div>
      </div>

      <div class="sensor-card">
        <svg class="sensor-icon" viewBox="0 0 36 36" fill="none">
          <path d="M18 4.5C18 4.5 7.5 16 7.5 23a10.5 10.5 0 0 0 21 0C28.5 16 18 4.5 18 4.5z" fill="#38bdf8" stroke="#0369a1" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M12.5 23.5a5.5 5.5 0 0 0 4.5 4.8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div class="sensor-text humi-text">
          Độ ẩm : <span id="humi-value">--</span> %
        </div>
      </div>
    </section>

    <!-- Nhóm nút điều khiển chính -->
    <section class="control-list">
      <button id="btn-auto" class="ctrl-btn btn-auto" data-mode="auto">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Tự động</span>
      </button>

      <button id="btn-cool" class="ctrl-btn btn-cool" data-mode="cool">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
        </svg>
        <span>Làm mát</span>
      </button>

      <button id="btn-timer" class="ctrl-btn btn-timer">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        <span>Hẹn giờ mỗi ngày</span>
      </button>

      <button id="btn-off" class="ctrl-btn btn-off" data-mode="off">
        <svg class="btn-icon icon-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <span>Tắt</span>
      </button>
    </section>
  </main>

  <!-- Modal Hẹn Giờ Mỗi Ngày -->
  <div id="timer-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button id="btn-close-modal" class="modal-close" aria-label="Đóng">&times;</button>

      <div class="modal-header">
        <svg class="alarm-icon" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="19" r="11" fill="#fde047" stroke="#dc2626" stroke-width="2.8"/>
          <circle cx="18" cy="19" r="8" fill="#ffffff"/>
          <path d="M7 9l4-3m18 3l-4-3M10 29l-2 3m18-3l2 3" stroke="#3b82f6" stroke-width="2.8" stroke-linecap="round"/>
          <path d="M15 15h6l-3 4 3 4h-6l3-4-3-4z" fill="#f97316"/>
        </svg>
        <h2 id="modal-title">Hẹn giờ mỗi ngày</h2>
      </div>

      <p class="modal-subtitle">Cài đặt thời gian hoạt động hàng ngày cho máy bơm</p>

      <!-- Giờ bắt đầu -->
      <div class="time-row">
        <span class="time-label">Giờ bắt đầu</span>
        <div class="time-pickers">
          <div class="spinner-box active" data-field="startHour">
            <button type="button" class="spin-btn up" aria-label="Tăng giờ bắt đầu">▲</button>
            <div class="spin-value" id="start-hour">06</div>
            <button type="button" class="spin-btn down" aria-label="Giảm giờ bắt đầu">▼</button>
          </div>
          <span class="time-colon">:</span>
          <div class="spinner-box" data-field="startMin">
            <button type="button" class="spin-btn up" aria-label="Tăng phút bắt đầu">▲</button>
            <div class="spin-value" id="start-min">30</div>
            <button type="button" class="spin-btn down" aria-label="Giảm phút bắt đầu">▼</button>
          </div>
        </div>
      </div>

      <!-- Giờ kết thúc -->
      <div class="time-row">
        <span class="time-label">Giờ kết thúc</span>
        <div class="time-pickers">
          <div class="spinner-box" data-field="endHour">
            <button type="button" class="spin-btn up" aria-label="Tăng giờ kết thúc">▲</button>
            <div class="spin-value" id="end-hour">07</div>
            <button type="button" class="spin-btn down" aria-label="Giảm giờ kết thúc">▼</button>
          </div>
          <span class="time-colon">:</span>
          <div class="spinner-box" data-field="endMin">
            <button type="button" class="spin-btn up" aria-label="Tăng phút kết thúc">▲</button>
            <div class="spin-value" id="end-min">00</div>
            <button type="button" class="spin-btn down" aria-label="Giảm phút kết thúc">▼</button>
          </div>
        </div>
      </div>

      <!-- Công tắc kích hoạt -->
      <div class="toggle-row">
        <span class="time-label">Kích hoạt hẹn giờ</span>
        <label class="switch">
          <input type="checkbox" id="timer-enabled" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Nút Hủy / Lưu -->
      <div class="modal-actions">
        <button type="button" id="btn-cancel-timer" class="modal-btn btn-cancel">Hủy</button>
        <button type="button" id="btn-save-timer" class="modal-btn btn-save">Lưu</button>
      </div>
    </div>
  </div>
</body>
</html>
